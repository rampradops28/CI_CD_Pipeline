# ==============================================================================
# Azure Pipelines: Enterprise CI Pipeline for FastAPI & SQLAlchemy
# ==============================================================================
# Architecture:
#   Stage 1: Code Quality (Ruff Lint & Format Validation with uv)
#   Stage 2: Unit Testing (Isolated in-memory Pytest + JUnit XML reporting)
#   Stage 3: Integration Testing (PostgreSQL Service Container + Alembic Migrations)
#   Stage 4: Docker Build Validation (Multi-stage build verification, Zero push)
#
# Best Practices Implemented:
#   - Modern Python packaging: PEP 621 pyproject.toml with uv package manager
#   - Dependency caching: ~/.cache/uv cached across runs for ultra-fast builds
#   - Native Azure DevOps dashboards: PublishTestResults@2 & PublishCodeCoverageResults@2
#   - Strict CI scope: Pure quality validation (no deployment or smoke tests)
# ==============================================================================

name: $(Date:yyyyMMdd)$(Rev:.r)-CI

# Trigger on main branch commits and active Pull Requests
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - common/**
      - .azuredevops/**

pr:
  branches:
    include:
      - main

# Global Pipeline Variables
variables:
  pythonVersion: '3.11'
  uvVersion: '0.4.15'
  # PostgreSQL Service Container Credentials
  POSTGRES_DB: 'test_db'
  POSTGRES_USER: 'postgres'
  POSTGRES_PASSWORD: 'postgres_secure_password'
  POSTGRES_PORT: '5432'
  # Global UV Cache Directory for Azure Pipeline Agents
  UV_CACHE_DIR: $(Pipeline.Workspace)/.uv-cache

# Service Container Resources (Used for Stage 3 Integration Testing)
resources:
  containers:
    - container: postgres_service
      image: postgres:15-alpine
      ports:
        - 5432:5432
      env:
        POSTGRES_DB: $(POSTGRES_DB)
        POSTGRES_USER: $(POSTGRES_USER)
        POSTGRES_PASSWORD: $(POSTGRES_PASSWORD)

stages:
  # ============================================================================
  # STAGE 1: Code Quality & Static Analysis
  # ============================================================================
  - stage: Code_Quality
    displayName: "Stage 1: Code Quality & Linting"
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: Lint_Validation
        displayName: "Ruff Lint & Syntax Gate"
        steps:
          # 1. Setup Python Runtime
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
            displayName: "Setup Python $(pythonVersion)"

          # 2. Install Astral uv Package Manager
          - script: |
              curl -LsSf https://astral.sh/uv/$(uvVersion)/install.sh | sh
              echo "##vso[task.prependpath]$HOME/.cargo/bin"
            displayName: "Install uv Package Manager (v$(uvVersion))"

          # 3. Cache uv Dependency Directory
          - task: Cache@2
            inputs:
              key: 'uv | "$(Agent.OS)" | pyproject.toml'
              restoreKeys: |
                uv | "$(Agent.OS)"
              path: $(UV_CACHE_DIR)
            displayName: "Cache uv Package Downloads"

          # 4. Install Project & Dev Dependencies from pyproject.toml
          - script: |
              uv pip install --system -e ".[dev]"
            displayName: "Install Dependencies via uv (pyproject.toml)"

          # 5. Run Ruff Static Linter & Formatting Checks
          - script: |
              echo "==> Running Ruff Lint Check..."
              uv run ruff check .
              echo "==> Running Ruff Format Check..."
              uv run ruff format --check .
            displayName: "Execute Ruff Code Quality Gate"

  # ============================================================================
  # STAGE 2: Unit Testing (In-Memory Isolation)
  # ============================================================================
  - stage: Unit_Testing
    displayName: "Stage 2: Unit Testing"
    dependsOn: Code_Quality
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: Unit_Tests
        displayName: "Execute In-Memory Unit Tests"
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
            displayName: "Setup Python $(pythonVersion)"

          - script: |
              curl -LsSf https://astral.sh/uv/$(uvVersion)/install.sh | sh
              echo "##vso[task.prependpath]$HOME/.cargo/bin"
            displayName: "Install uv"

          - task: Cache@2
            inputs:
              key: 'uv | "$(Agent.OS)" | pyproject.toml'
              restoreKeys: |
                uv | "$(Agent.OS)"
              path: $(UV_CACHE_DIR)
            displayName: "Restore uv Cache"

          - script: |
              uv pip install --system -e ".[dev]"
            displayName: "Install Dependencies via uv"

          # Run Isolated Unit Tests (Marked with @pytest.mark.unit)
          - script: |
              mkdir -p junit
              uv run pytest tests/unit -m unit -v \
                --junitxml=junit/unit-test-results.xml
            displayName: "Run Pytest Unit Tests"

          # Publish JUnit XML Report to Azure DevOps Native Tests Tab
          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/junit/unit-test-results.xml'
              testRunTitle: 'FastAPI In-Memory Unit Tests'
              failTaskOnFailedTests: true
            condition: succeededOrFailed()
            displayName: "Publish Unit Test Results to Azure DevOps"

  # ============================================================================
  # STAGE 3: Integration Testing (PostgreSQL Service Container + Alembic)
  # ============================================================================
  - stage: Integration_Testing
    displayName: "Stage 3: Integration Testing"
    dependsOn: Code_Quality
    pool:
      vmImage: 'ubuntu-latest'
    # Bind temporary PostgreSQL 15 service container to this job
    services:
      postgres: postgres_service
    jobs:
      - job: Database_Integration_Tests
        displayName: "Alembic Migrations & DB Integration"
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
            displayName: "Setup Python $(pythonVersion)"

          - script: |
              curl -LsSf https://astral.sh/uv/$(uvVersion)/install.sh | sh
              echo "##vso[task.prependpath]$HOME/.cargo/bin"
              sudo apt-get update && sudo apt-get install -y postgresql-client
            displayName: "Install uv & PostgreSQL Client"

          - task: Cache@2
            inputs:
              key: 'uv | "$(Agent.OS)" | pyproject.toml'
              restoreKeys: |
                uv | "$(Agent.OS)"
              path: $(UV_CACHE_DIR)
            displayName: "Restore uv Cache"

          - script: |
              uv pip install --system -e ".[dev]"
            displayName: "Install Dependencies via uv"

          # Poll PostgreSQL Container until healthy
          - script: |
              echo "Checking PostgreSQL connection on port $(POSTGRES_PORT)..."
              for i in {1..30}; do
                if pg_isready -h localhost -p $(POSTGRES_PORT) -U $(POSTGRES_USER) -d $(POSTGRES_DB); then
                  echo "PostgreSQL is online and accepting connections!"
                  exit 0
                fi
                echo "PostgreSQL not ready yet. Retrying in 1s ($i/30)..."
                sleep 1
              done
              echo "Timeout waiting for PostgreSQL service container."
              exit 1
            displayName: "Wait for PostgreSQL Container Health"

          # Execute Alembic Database Migrations against temporary PostgreSQL
          - script: |
              export DATABASE_URL="postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@localhost:$(POSTGRES_PORT)/$(POSTGRES_DB)"
              echo "==> Running Alembic Migrations to Head..."
              uv run alembic upgrade head
            displayName: "Run Alembic Database Migrations (upgrade head)"

          # Execute Integration Tests against live migrated database
          - script: |
              export DATABASE_URL="postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@localhost:$(POSTGRES_PORT)/$(POSTGRES_DB)"
              mkdir -p junit
              uv run pytest tests/integration -m integration -v \
                --junitxml=junit/integration-test-results.xml \
                --cov=app \
                --cov-fail-under=80 \
                --cov-report=xml:coverage.xml \
                --cov-report=html:htmlcov
            displayName: "Execute Pytest Integration Tests & Coverage Gate"

          # Publish JUnit XML Results to Azure DevOps
          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/junit/integration-test-results.xml'
              testRunTitle: 'PostgreSQL API Integration Tests'
              failTaskOnFailedTests: true
            condition: succeededOrFailed()
            displayName: "Publish Integration Test Results to Azure DevOps"

          # Publish Code Coverage Results to Azure DevOps
          - task: PublishCodeCoverageResults@2
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'
              pathToSources: '$(System.DefaultWorkingDirectory)/app'
              failIfCoverageEmpty: false
            condition: succeededOrFailed()
            displayName: "Publish Cobertura Code Coverage to Azure DevOps"

  # ============================================================================
  # STAGE 4: Docker Build Validation (Zero Push)
  # ============================================================================
  - stage: Docker_Build_Validation
    displayName: "Stage 4: Docker Build Validation"
    dependsOn:
      - Unit_Testing
      - Integration_Testing
    condition: succeeded()
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: Build_Docker_Image
        displayName: "Validate Production Container Build"
        steps:
          # Build Docker image using the multi-stage Dockerfile
          - script: |
              IMAGE_TAG="common-service:$(Build.SourceVersion)"
              echo "==> Compiling Docker image: ${IMAGE_TAG}..."
              docker build -t "${IMAGE_TAG}" .
            displayName: "Build OCI Docker Image"

          # Verify that the image was created and is valid locally
          - script: |
              IMAGE_TAG="common-service:$(Build.SourceVersion)"
              echo "==> Verifying image metadata..."
              docker image inspect "${IMAGE_TAG}" > /dev/null
              echo "✅ Docker image verification succeeded. Size:"
              docker images "${IMAGE_TAG}"
              echo "Security note: Strict CI policy enforced - image will NOT be pushed."
            displayName: "Verify Local Image Integrity (Zero Registry Push)"

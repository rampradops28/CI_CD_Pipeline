name: Reusable Python & Docker CI Pipeline

# 🔑 on: workflow_call makes this workflow a reusable library callable by other repositories.
# It does NOT run on push directly; it only runs when another workflow calls it.
on:
  workflow_call:
    inputs:
      working-directory:
        description: "Subdirectory containing the application code and Dockerfile"
        required: false
        type: string
        default: "."

      python-version:
        description: "Python version to set up on the runner"
        required: false
        type: string
        default: "3.11"

      min-coverage:
        description: "Minimum test coverage percentage required to pass"
        required: false
        type: number
        default: 80

      image-name:
        description: "Docker image tag name"
        required: false
        type: string
        default: "app"

      app-port:
        description: "Port the container exposes and listens on"
        required: false
        type: number
        default: 8000

      health-endpoint:
        description: "HTTP endpoint path checked during the smoke test"
        required: false
        type: string
        default: "/health"

jobs:
  ci:
    name: Test, Coverage & Docker Smoke Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the caller's code onto the runner
      - name: Checkout caller code
        uses: actions/checkout@v4

      # Step 2: Set up Python runtime
      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"
          cache-dependency-path: "${{ inputs.working-directory }}/requirements.txt"

      # Step 3: Install dependencies
      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run tests and enforce code coverage threshold
      - name: Run Pytest with Coverage Gate
        working-directory: ${{ inputs.working-directory }}
        run: |
          pytest tests/ \
            --import-mode=importlib \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=${{ inputs.min-coverage }}

      # Step 5: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 6: Build the application image
      - name: Build Docker image
        working-directory: ${{ inputs.working-directory }}
        run: |
          docker build -t ${{ inputs.image-name }}:latest .

      # Step 7: Run container, perform live health check, and stop container
      - name: Run container & verify health check
        run: |
          # 1. Start the container in background
          docker run -d --name test-container -p ${{ inputs.app-port }}:${{ inputs.app-port }} ${{ inputs.image-name }}:latest

          # 2. Wait briefly for Uvicorn server to initialize
          sleep 3

          # 3. Call the health endpoint (fails if response is not 200 OK)
          curl --fail http://localhost:${{ inputs.app-port }}${{ inputs.health-endpoint }}

          # 4. Stop and clean up container
          docker stop test-container

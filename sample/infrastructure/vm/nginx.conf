# ==============================================================================
# /etc/nginx/sites-available/fastapi.conf
# Nginx Reverse Proxy Configuration for FastAPI Services on EC2
# ==============================================================================

upstream learning_service {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream order_service {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Global proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Route 1: Learning Service (Port 8000)
    location /learning/ {
        rewrite ^/learning/(.*) /$1 break;
        proxy_pass http://learning_service;
    }

    # Direct access for learning service root/health
    location /health {
        proxy_pass http://learning_service/health;
    }

    # Route 2: Order Service (Port 8080)
    location /order/ {
        rewrite ^/order/(.*) /$1 break;
        proxy_pass http://order_service;
    }

    location /healthz {
        proxy_pass http://order_service/healthz;
    }

    # Default fallback / root
    location / {
        proxy_pass http://learning_service;
    }
}

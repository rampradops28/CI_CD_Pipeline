name: App CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Call the reusable workflow
  build-and-test:
    name: Run Reusable Pipeline
    uses: ./.github/workflows/reusable-pipeline.yml
    with:
      python-version: "3.11"
      min-coverage: 80
      image-name: "fastapi-app"
      app-port: 8000
      health-endpoint: "/health"

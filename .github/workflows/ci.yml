name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==============================================================
  # Job 1: Run Tests and Enforce 80% Coverage
  # ==============================================================
  test:
    name: Run Tests & Check Coverage (>80%)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
    
      - name: Run Tests with 80% Coverage Gate
        run: |
          pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  # ==============================================================
  # Job 2: Build Docker Image and Verify It Runs
  # ==============================================================
  docker-build:
    name: Build & Verify Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t fastapi-app:latest .

      - name: Verify Container Runs (Smoke Test)
        run: |
          # Start the container in background
          docker run -d --name my-api -p 8000:8000 fastapi-app:latest
          
          # Wait 3 seconds for Uvicorn to boot up
          sleep 3
          
          # Hit the /health endpoint to make sure it returns 200 OK
          curl --fail http://localhost:8000/health
          
          # Stop and clean up container
          docker stop my-api

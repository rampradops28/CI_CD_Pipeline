# ==============================================================================
# Azure DevOps CI Pipeline: FastAPI Application
# ==============================================================================
# Objective:
#   Strict Continuous Integration (CI) validation only.
#   Validates code quality, static typing, security vulnerabilities,
#   in-memory unit tests, PostgreSQL integration tests, 80% coverage threshold,
#   and Docker container build validity.
#
# Scope Boundary:
#   - CI validation only.
#   - Zero Continuous Deployment (CD).
#   - Zero Docker image push to any container registry.
#   - Zero package publishing to Azure Artifacts.
#   - No reusable templates (application-specific pipeline).
# ==============================================================================

name: $(Date:yyyyMMdd)$(Rev:.r)-CI

# Trigger on pushes to working branch
trigger:
  branches:
    include:
      - main
      - master
      - develop

# Trigger on Pull Requests targeting working branch
pr:
  branches:
    include:
      - main
      - master
      - develop

# Global Pipeline Variables
variables:
  pythonVersion: '3.11'
  # PostgreSQL Service Container Credentials for Integration Tests
  POSTGRES_DB: 'fastapi_test_db'
  POSTGRES_USER: 'postgres'
  POSTGRES_PASSWORD: 'postgres_secure_test_password'
  POSTGRES_PORT: '5432'
  # Dedicated PostgreSQL driver connection string for integration test runner
  DATABASE_URL: 'postgresql+psycopg://postgres:postgres_secure_test_password@localhost:5432/fastapi_test_db'
  PIP_CACHE_DIR: $(Pipeline.Workspace)/.pip-cache

# Service Container Resource Definition (Used in Stage 3: Integration Testing)
resources:
  containers:
    - container: postgres_service
      image: postgres:15-alpine
      ports:
        - 5432:5432
      env:
        POSTGRES_DB: $(POSTGRES_DB)
        POSTGRES_USER: $(POSTGRES_USER)
        POSTGRES_PASSWORD: $(POSTGRES_PASSWORD)

stages:
  # ============================================================================
  # STAGE 1: Code Quality & Security Verification
  # ============================================================================
  - stage: Code_Quality_And_Security
    displayName: "Stage 1: Code Quality & Security"
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: Static_Analysis_And_Security_Scan
        displayName: "Lint, Type Check & Security Auditing"
        steps:
          # Step 1: Check out repository
          - checkout: self

          # Step 2: Configure Python runtime
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
            displayName: "Set up Python $(pythonVersion)"

          # Step 3: Cache pip downloads
          - task: Cache@2
            inputs:
              key: 'pip | "$(Agent.OS)" | requirements-dev.txt'
              restoreKeys: |
                pip | "$(Agent.OS)"
              path: $(PIP_CACHE_DIR)
            displayName: "Cache pip dependencies"

          # Step 4: Install application and development dependencies
          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements-dev.txt
            displayName: "Install dependencies from requirements-dev.txt"

          # Step 5: Ruff Linting (Enforces PEP 8, import sorting, bugbear rules)
          - script: |
              echo "==> Running Ruff Linting..."
              ruff check .
            displayName: "Run Ruff Lint Check"

          # Step 6: Ruff Formatting Verification (Without modifying files)
          - script: |
              echo "==> Checking Ruff Code Formatting..."
              ruff format --check .
            displayName: "Run Ruff Formatting Check"

          # Step 7: mypy Static Type Checking (Strict Mode)
          - script: |
              echo "==> Running mypy Static Type Analysis..."
              mypy app
            displayName: "Run mypy Type Check"

          # Step 8: Bandit Static Security Analysis (AST Security Scanner)
          - script: |
              echo "==> Running Bandit Static Security Analysis..."
              bandit -r app -c pyproject.toml
            displayName: "Run Bandit Security Analysis"

          # Step 9: pip-audit Dependency Vulnerability Scan
          - script: |
              echo "==> Scanning installed dependencies for known CVEs..."
              pip-audit -r requirements.txt
            displayName: "Run pip-audit Vulnerability Scan"

  # ============================================================================
  # STAGE 2: Unit Testing (In-Memory Isolation)
  # ============================================================================
  - stage: Unit_Testing
    displayName: "Stage 2: Unit Testing"
    dependsOn: Code_Quality_And_Security
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: Execute_Unit_Tests
        displayName: "Run Isolated Unit Tests"
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
            displayName: "Set up Python $(pythonVersion)"

          - task: Cache@2
            inputs:
              key: 'pip | "$(Agent.OS)" | requirements-dev.txt'
              restoreKeys: |
                pip | "$(Agent.OS)"
              path: $(PIP_CACHE_DIR)
            displayName: "Restore pip cache"

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements-dev.txt
            displayName: "Install dependencies"

          # Step: Execute Unit Tests and Generate JUnit XML report
          - script: |
              mkdir -p junit
              pytest tests/unit -m unit -v \
                --junitxml=junit/unit-test-results.xml
            displayName: "Execute Pytest Unit Tests"

          # Step: Publish JUnit XML to Azure DevOps Tests Tab
          # Executes even if tests fail (condition: succeededOrFailed())
          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/junit/unit-test-results.xml'
              testRunTitle: 'FastAPI In-Memory Unit Tests'
              failTaskOnFailedTests: true
            condition: succeededOrFailed()
            displayName: "Publish Unit Test Results to Azure DevOps"

  # ============================================================================
  # STAGE 3: Integration Testing (PostgreSQL Service Container)
  # ============================================================================
  - stage: Integration_Testing
    displayName: "Stage 3: Integration Testing"
    dependsOn: Code_Quality_And_Security
    pool:
      vmImage: 'ubuntu-latest'
    # Bind dedicated PostgreSQL 15 container to this job
    services:
      postgres: postgres_service
    jobs:
      - job: Execute_Integration_Tests
        displayName: "Run PostgreSQL Integration Tests & Coverage"
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
            displayName: "Set up Python $(pythonVersion)"

          - script: |
              sudo apt-get update && sudo apt-get install -y postgresql-client
            displayName: "Install PostgreSQL client tools (pg_isready)"

          - task: Cache@2
            inputs:
              key: 'pip | "$(Agent.OS)" | requirements-dev.txt'
              restoreKeys: |
                pip | "$(Agent.OS)"
              path: $(PIP_CACHE_DIR)
            displayName: "Restore pip cache"

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements-dev.txt
            displayName: "Install dependencies"

          # Step: Wait for PostgreSQL service container to report healthy
          - script: |
              echo "Polling PostgreSQL service container on port $(POSTGRES_PORT)..."
              for i in {1..30}; do
                if pg_isready -h localhost -p $(POSTGRES_PORT) -U $(POSTGRES_USER) -d $(POSTGRES_DB); then
                  echo "PostgreSQL is accepting connections!"
                  exit 0
                fi
                echo "PostgreSQL is not ready yet. Retrying in 1s ($i/30)..."
                sleep 1
              done
              echo "PostgreSQL service container failed to become ready in 30 seconds."
              exit 1
            displayName: "Wait for PostgreSQL Container Health (pg_isready)"

          # Step: Run Integration Tests & Enforce 80% Coverage Gate
          - script: |
              mkdir -p junit
              pytest tests/integration -m integration -v \
                --junitxml=junit/integration-test-results.xml \
                --cov=app \
                --cov-fail-under=80 \
                --cov-report=xml:coverage.xml \
                --cov-report=html:htmlcov
            displayName: "Execute Integration Tests & Enforce Coverage Threshold"
            env:
              DATABASE_URL: $(DATABASE_URL)

          # Step: Publish Integration Test Results
          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/junit/integration-test-results.xml'
              testRunTitle: 'PostgreSQL Database Integration Tests'
              failTaskOnFailedTests: true
            condition: succeededOrFailed()
            displayName: "Publish Integration Test Results to Azure DevOps"

          # Step: Publish Cobertura Coverage to Azure DevOps Code Coverage Tab
          - task: PublishCodeCoverageResults@2
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'
              pathToSources: '$(System.DefaultWorkingDirectory)/app'
              failIfCoverageEmpty: true
            condition: succeededOrFailed()
            displayName: "Publish Cobertura Code Coverage to Azure DevOps"

  # ============================================================================
  # STAGE 4: Docker Build Validation (Strict Zero-Push Policy)
  # ============================================================================
  - stage: Docker_Build_Validation
    displayName: "Stage 4: Docker Build Validation"
    dependsOn:
      - Unit_Testing
      - Integration_Testing
    condition: succeeded()
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: Validate_Docker_Image
        displayName: "Compile & Verify Container Locally"
        steps:
          - checkout: self

          # Step: Build Docker image locally on pipeline agent
          - script: |
              IMAGE_TAG="fastapi-ci-app:$(Build.SourceVersion)"
              echo "==> Compiling Docker image: ${IMAGE_TAG}..."
              docker build -t "${IMAGE_TAG}" .
            displayName: "Build Docker Image Locally"

          # Step: Verify image creation succeeds and assert metadata
          - script: |
              IMAGE_TAG="fastapi-ci-app:$(Build.SourceVersion)"
              echo "==> Verifying image metadata and architecture..."
              docker image inspect "${IMAGE_TAG}" > /dev/null
              echo "Container image verified successfully. Local size details:"
              docker images "${IMAGE_TAG}"
              echo "=========================================================="
              echo "✅ Docker build validation completed successfully."
              echo "🔒 CI SCOPE ENFORCED: Zero image push to any registry."
              echo "=========================================================="
            displayName: "Verify Local Image Integrity (Zero Registry Push)"

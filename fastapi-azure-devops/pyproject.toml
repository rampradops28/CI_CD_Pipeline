[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-ci-project"
version = "0.1.0"
description = "Production-grade FastAPI CI application with PostgreSQL, pytest, and Azure DevOps"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.28",
    "psycopg[binary]>=3.1.18",
    "pydantic[email]>=2.6.4",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ==============================================================================
# Ruff Linter & Formatter Configuration
# ==============================================================================
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort import ordering
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit security rules
]
ignore = [
    "E501", # Handled by formatter
    "B008", # FastAPI Depends in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # Allow assert in pytest test files

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

# ==============================================================================
# mypy Static Type Checker Configuration
# ==============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*"]
ignore_missing_imports = true

# ==============================================================================
# Bandit Security Scanner Configuration
# ==============================================================================
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"] # Skip assert checks outside tests

# ==============================================================================
# Pytest Configuration
# ==============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q --import-mode=importlib"
markers = [
    "unit: Fast isolated in-memory unit tests without database",
    "integration: PostgreSQL integration tests requiring database container",
]
